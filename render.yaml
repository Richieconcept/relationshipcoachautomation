services:
  - type: web
    name: relationshipcoachautomation
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "true"
      - key: ALLOW_REMOTE_CONTROLS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: PORT
        value: "10000"
      - key: DEFAULT_PUBLISH_PLATFORMS
        value: facebook,youtube

      - key: MAX_SCENE_RETRIES
        value: "5"
      - key: MAX_SCENE_REPLACEMENTS
        value: "1"
      - key: MAX_DOWNLOAD_RECOVERY_ATTEMPTS
        value: "3"
      - key: RETRY_SCENE_UNTIL_SUCCESS
        value: "false"
